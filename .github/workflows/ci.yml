name: CI

on:
  push:
    branches: [main, master, umkm]
  pull_request:
    branches: [main, master, umkm]

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Postgres service untuk integration test (repo methods yang query DB
    # aktual). Test yang tidak butuh DB tetap jalan tanpa service ini.
    # Test yang butuh DB baca TEST_DATABASE_URL — kalau kosong, skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: webbuilder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d webbuilder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -timeout 90s ./...
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/webbuilder_test?sslmode=disable

  web:
    name: Web (Next.js dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080

  renderer:
    name: Renderer (Next.js public)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/renderer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/renderer/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:8080
