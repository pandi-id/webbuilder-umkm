services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webbuilder}
      POSTGRES_DB: ${POSTGRES_DB:-webbuilder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webbuilder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # --- Core ---
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      APP_BASE_URL: ${APP_BASE_URL:-http://app.localhost}
      # --- Database ---
      DATABASE_URL: postgres://${POSTGRES_USER:-webbuilder}:${POSTGRES_PASSWORD:-webbuilder}@postgres:5432/${POSTGRES_DB:-webbuilder}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-15m}
      DB_SLOW_QUERY_THRESHOLD: ${DB_SLOW_QUERY_THRESHOLD:-500ms}
      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"
      # --- Admin bootstrap + demo seed ---
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@example.com}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
      # --- Caddy on-demand TLS ---
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-dev-caddy-secret}
      # --- Hosts + CORS + platform IPs ---
      PUBLIC_APP_HOST: ${PUBLIC_APP_HOST:-app.localhost}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-api.localhost}
      RENDERER_DEFAULT_HOST: ${RENDERER_DEFAULT_HOST:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://app.localhost}
      PLATFORM_IPS: ${PLATFORM_IPS:-}
      # --- Storage: pick one driver: local | s3 ---
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-minio:9000}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-assets}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-http://localhost:9000/assets}
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_LOCAL_PUBLIC_URL: ${STORAGE_LOCAL_PUBLIC_URL:-http://api.localhost/uploads}
      # --- Image compression ---
      IMAGE_COMPRESS_ENABLED: ${IMAGE_COMPRESS_ENABLED:-true}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2000}
      IMAGE_JPEG_QUALITY: ${IMAGE_JPEG_QUALITY:-82}
      # --- Mail (log = stdout, smtp = SMTP relay) ---
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Web Builder <no-reply@example.com>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # --- Google OAuth (isi ketiganya untuk enable) ---
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://api.localhost/api/v1/auth/google/callback}
      # --- e.id OAuth SSO (client id + secret untuk enable) ---
      EID_OAUTH_CLIENT_ID: ${EID_OAUTH_CLIENT_ID:-}
      EID_OAUTH_CLIENT_SECRET: ${EID_OAUTH_CLIENT_SECRET:-}
      EID_API_BASE: ${EID_API_BASE:-https://api-wallet.e.id}
      # --- api-registry backend (self-sufficient EPP service) ---
      # Default point ke api-registry service via internal network.
      # HMAC secret harus sama dengan api-registry INTERNAL_HMAC_SECRET.
      API_REGISTRY_URL: ${WEBBUILDER_API_REGISTRY_URL:-http://api-registry:5000}
      API_REGISTRY_HMAC_SECRET: ${API_REGISTRY_HMAC_SECRET:-}
      API_REGISTRY_TIMEOUT: ${WEBBUILDER_API_REGISTRY_TIMEOUT:-30s}
      # --- Observability ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      api-registry:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  # api-registry — internal service untuk domain lifecycle + EPP execution.
  # Konsumer tunggal: `api` (via internal HTTP + HMAC).
  #
  # Mode default: `epp_direct` — native EPP client, zero dependency ke
  # registrar-api PANDI. Butuh EPP_* credentials dari PANDI onboarding.
  # Legacy: set API_REGISTRY_PROVIDER_MODE=pandi_wrapper untuk hybrid mode.
  api-registry:
    build:
      context: ../apps/api-registry
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "5000"

      # Provider mode — default epp_direct (self-sufficient). Set ke
      # pandi_wrapper untuk hybrid transition mode.
      PROVIDER_MODE: ${API_REGISTRY_PROVIDER_MODE:-epp_direct}

      # EPP direct credentials (PRIMARY — PROVIDER_MODE=epp_direct).
      # Wajib set kalau customer punya PANDI accreditation.
      EPP_HOST: ${EPP_HOST:-epp1.pandi.id}
      EPP_PORT: ${EPP_PORT:-700}
      EPP_USER: ${EPP_USER:-}
      EPP_PASSWORD: ${EPP_PASSWORD:-}
      EPP_CERT_FILE: ${EPP_CERT_FILE:-}
      EPP_KEY_FILE: ${EPP_KEY_FILE:-}
      EPP_CA_FILE: ${EPP_CA_FILE:-}
      EPP_INSECURE_SKIP_VERIFY: ${EPP_INSECURE_SKIP_VERIFY:-false}
      EPP_KEEPALIVE_INTERVAL: ${EPP_KEEPALIVE_INTERVAL:-5m}

      # Internal HMAC — WAJIB sama dengan `api` sisi API_REGISTRY_HMAC_SECRET.
      # Kosong = dev mode (skip auth).
      INTERNAL_HMAC_SECRET: ${API_REGISTRY_HMAC_SECRET:-}

      # Runtime tuning.
      REQUEST_TIMEOUT: ${API_REGISTRY_REQUEST_TIMEOUT:-30s}
      MAX_CONCURRENT: ${API_REGISTRY_MAX_CONCURRENT:-20}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://api.localhost}
      NODE_ENV: production
    ports:
      - "3000:3000"

  renderer:
    build:
      context: ../apps/renderer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "3001:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - renderer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-dev-caddy-secret}

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  caddydata:
  caddyconfig:
